# =============================================================================
# CONFIGURACION GENERAL - aplica a todos los perfiles
# Lo especifico de cada entorno vive en application-<perfil>.properties
# =============================================================================

spring.application.name=bodeguita-backend

# 0.0.0.0 = escucha en todas las interfaces (LAN included). Con 127.0.0.1
# solo aceptaria conexiones del propio equipo y el telefono no llegaria.
server.address=0.0.0.0

# Variable de entorno PORT. Si no esta definida, usa el puerto de desarrollo.
server.port=${PORT:8080}

# Perfil activo. Sin definir, arranca en 'local'.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# -----------------------------------------------------------------------------
# Variables que se pueden sobreescribir al arrancar (ejemplo: $env:PORT=9090)
#
#   PORT                  puerto del servidor
#   SPRING_PROFILES_ACTIVE   local | prod
#   DB_URL / DB_USERNAME / DB_PASSWORD   credenciales (ver application-prod)
#   CORS_ORIGINS          origenes permitidos separados por coma (ver prod)
#   CODIGO_API            codigo de acceso a la API (header X-API-Key). En Render definalo como variable de entorno.
#                         Si esta vacia, la validacion queda desactivada (desarrollo).
#
# Ver README / respuesta-001.txt para el detalle por perfil.

# -----------------------------------------------------------------------------
# API Key
# app.api.key=${CODIGO_API:}
# -----------------------------------------------------------------------------
app.api.key=${CODIGO_API:}
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# SUNAT / DNI-RUC API (configurable)
# sunat.api.url  = URL base de la API de consulta (ej. https://apis.net.pe/api-tipo-cambios.html o tu endpoint)
# sunat.api.token = tu token de acceso (Bearer)
# sunat.api.timeout = tiempo de espera en ms (default 10000)
# -----------------------------------------------------------------------------
sunat.api.url=${SUNAT_API_URL:}
sunat.api.token=${SUNAT_API_TOKEN:}
sunat.api.timeout=${SUNAT_API_TIMEOUT:10000}
# -----------------------------------------------------------------------------

# --- Diagnostico de arranque (temporal) ---
logging.level.org.springframework=DEBUG
logging.level.org.hibernate=ERROR
logging.level.root=INFO
