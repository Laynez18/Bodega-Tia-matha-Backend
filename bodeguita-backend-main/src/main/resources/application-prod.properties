# =============================================================================
# PERFIL PROD - produccion
#   PowerShell:  $env:SPRING_PROFILES_ACTIVE="prod"; .\mvnw.cmd spring-boot:run
#   Linux:       SPRING_PROFILES_ACTIVE=prod java -jar target/*.jar
# =============================================================================

# --- Base de datos -----------------------------------------------------------
# Sin defaults a proposito: si falta la variable, la app NO debe arrancar con
# la base de desarrollo. Se define con DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-query=SELECT 1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.min-idle=5

# --- JPA ---------------------------------------------------------------------
# validate en produccion: nunca modifica el esquema. Los cambios son
# migraciones explicitas, no automaticas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Sesion ------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# none + secure: permite que la cookie viaje en peticiones cross-site
# (front y back en dominios distintos). secure=true es OBLIGATORIO, el
# navegador descarta una cookie SameSite=None que no venga por HTTPS.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Nunca se exponen los mensajes de error al cliente.
server.error.include-message=never

# --- CORS --------------------------------------------------------------------
# Origenes reales de produccion, separados por coma. Sin comodin: con
# allowCredentials(true) el origen tiene que coincidir exactamente.
app.cors.origins=${CORS_ORIGINS}

# --- API Key -----------------------------------------------------------------
# Codigo de acceso a la API. OBLIGATORIO en produccion: definir CODIGO_API como
# variable de entorno en Render. Se envia en el header X-API-Key.
app.api.key=Codigo_API

# --- FACTILIZA / DNI-RUC API (api.factiliza.com) -----------------------------
# OBLIGATORIO en produccion: definir FACTILIZA_API_URL y FACTILIZA_API_TOKEN en Render.
# factiliza.api.url = https://api.factiliza.com/v1   (sin el /dni/info/ ni /ruc/info/ final)
factiliza.api.url=${FACTILIZA_API_URL}
factiliza.api.path-dni=${FACTILIZA_API_PATH_DNI:/dni/info/}
factiliza.api.path-ruc=${FACTILIZA_API_PATH_RUC:/ruc/info/}
factiliza.api.token=${FACTILIZA_API_TOKEN}
factiliza.api.timeout=${FACTILIZA_API_TIMEOUT:10000}
# -----------------------------------------------------------------------------
# Necesario si hay un proxy/load balancer delante (Nginx, AWS ALB): para que
# Spring entienda el esquema y el host originales en HTTPS.
server.forward-headers-strategy=framework
